<!-- PR Focus icon: a list with one row in focus. Drawn on a 16-unit grid so the 16 px PNG stays sharp. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="3.5" fill="#1b2433"/>
  <rect x="3" y="2" width="10" height="2" rx="0.5" fill="#fff" opacity="0.32"/>
  <rect x="2" y="6" width="12" height="4" rx="1" fill="#ffc53d"/>
  <rect x="3" y="12" width="7" height="2" rx="0.5" fill="#fff" opacity="0.32"/>
</svg>
